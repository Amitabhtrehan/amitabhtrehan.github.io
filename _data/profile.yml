bio: >-
  I am an Associate Professor in the Department of Computer Science at Durham University
  and Head of the NESTiD research group. I work in theoretical computer science, developing
  algorithms for distributed and networked systems, with particular interests in resilience,
  dynamism, graph algorithms and strategic interaction.
